<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset & Operations Brain</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2330; --line:#2a3646; --txt:#e6edf3; --muted:#8b9bb0;
          --accent:#3b82f6; --hi:#22c55e; --med:#f59e0b; --lo:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--txt); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center;
           gap:10px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:11px; color:var(--muted); }
  select { margin-left:auto; background:var(--panel); color:var(--txt); border:1px solid var(--line);
           border-radius:8px; padding:6px 8px; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:680px; width:100%; align-self:center; }
  .q { align-self:flex-end; background:var(--accent); color:#fff; padding:10px 14px; border-radius:14px 14px 4px 14px;
       max-width:85%; font-size:15px; }
  .a { background:var(--panel); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:14px; }
  .a .answer { white-space:pre-wrap; font-size:15px; line-height:1.5; }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
           margin-bottom:10px; }
  .badge.High{background:rgba(34,197,94,.15);color:var(--hi);} .badge.Medium{background:rgba(245,158,11,.15);color:var(--med);}
  .badge.Low{background:rgba(239,68,68,.15);color:var(--lo);}
  .break { font-size:11px; color:var(--muted); margin-bottom:10px; }
  details { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  summary { cursor:pointer; font-size:13px; color:var(--muted); }
  .chip { display:block; font-size:12px; background:#0d1117; border:1px solid var(--line); border-radius:8px;
          padding:8px 10px; margin-top:6px; }
  .chip b { color:var(--accent); }
  .chip .ref { color:var(--muted); font-size:11px; }
  footer { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; }
  #q { flex:1; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:10px;
       padding:12px; font-size:15px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:15px;
           font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .hint { color:var(--muted); font-size:13px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>🛢️ Asset &amp; Operations Brain</h1>
      <div class="sub">Ask about equipment, maintenance, safety &amp; compliance</div>
    </div>
    <select id="role" title="Your role">
      <option value="">No role</option>
      <option>Field Technician</option>
      <option>Maintenance Engineer</option>
      <option>Safety Officer</option>
      <option>Auditor</option>
    </select>
  </header>

  <div id="chat">
    <div class="hint">Try: <em>"Is pump P-101B overdue for inspection?"</em><br/>
      or <em>"What does OSHA require for process safety information?"</em></div>
  </div>

  <footer>
    <input id="q" placeholder="Ask a question…" autocomplete="off" />
    <button id="send">Ask</button>
  </footer>

<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
const roleSel = document.getElementById('role');

function el(cls, html){ const d=document.createElement('div'); d.className=cls; if(html!=null) d.innerHTML=html; return d; }
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addQuestion(text){
  const wrap = el('msg'); wrap.style.display='flex'; wrap.style.flexDirection='column';
  wrap.appendChild(el('q', esc(text)));
  chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
}

function addAnswer(data){
  const wrap = el('msg');
  const a = el('a');
  const c = data.confidence || {};
  a.appendChild(el('badge '+(c.label||''),
     `Confidence: ${c.label||'?'} (${c.score??'?'})`));
  if (c.breakdown) a.appendChild(el('break',
     `retrieval ${c.breakdown.retrieval} · support ${c.breakdown.support} · graph ${c.breakdown.graph}`));
  a.appendChild(el('answer', esc(data.answer)));

  if ((data.facts||[]).length){
    const d=document.createElement('details');
    d.appendChild(Object.assign(document.createElement('summary'),{textContent:`Graph facts (${data.facts.length})`}));
    data.facts.forEach(f=> d.appendChild(el('chip', `<b>[${f.label}]</b> ${esc(f.text)}`)));
    a.appendChild(d);
  }
  if ((data.sources||[]).length){
    const d=document.createElement('details');
    d.appendChild(Object.assign(document.createElement('summary'),{textContent:`Document sources (${data.sources.length})`}));
    data.sources.forEach(s=> d.appendChild(el('chip',
       `<b>[${s.label}]</b> <span class="ref">${esc(s.ref)}</span><br/>${esc(s.text)}…`)));
    a.appendChild(d);
  }
  wrap.appendChild(a); chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
}

async function ask(){
  const q = qInput.value.trim(); if(!q) return;
  const firstHint = chat.querySelector('.hint'); if(firstHint) firstHint.remove();
  addQuestion(q); qInput.value=''; sendBtn.disabled=true;
  const thinking = el('msg'); thinking.appendChild(el('a','<span class="break">Thinking…</span>'));
  chat.appendChild(thinking); chat.scrollTop = chat.scrollHeight;
  try {
    const res = await fetch('/ask', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question:q, role: roleSel.value || null }) });
    const data = await res.json();
    thinking.remove(); addAnswer(data);
  } catch(e) {
    thinking.remove(); addAnswer({answer:'Error: '+e, confidence:{label:'Low',score:0}});
  } finally { sendBtn.disabled=false; qInput.focus(); }
}
sendBtn.onclick = ask;
qInput.addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });
</script>
</body>
</html>
