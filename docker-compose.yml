# One command for everything: `docker compose up`
#   app      = the API + UI (built from ./Dockerfile)
#   ollama   = optional fully-local LLM (text + vision) — no models are pulled
#              automatically; run `make ollama-pull` once you want them
#   neo4j    = optional persisted graph + Cypher browser (the app works without it)
#   postgres = app state + the time-series table for equipment readings
#   minio    = raw document storage (S3-compatible, local)
#
# Real documents (data/corpus) and the ingested graph (data/staging) are
# bind-mounted from this project folder, not hidden inside Docker — open them
# in a normal file browser, same paths as running python run.py directly.
services:
  app:
    build: .
    container_name: brain-app
    ports:
      - "8000:8000"       # UI: http://localhost:8000/ui  ·  API docs: /docs
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      ONTOLOGY_PROFILE: ${ONTOLOGY_PROFILE:-config/ontology/oil_and_gas.yaml}
      STAGING_DIR: /app/data/staging
      CORPUS_DIR: /app/data/corpus
    volumes:
      - ./data/corpus:/app/data/corpus
      - ./data/staging:/app/data/staging
      - ./data/readings:/app/data/readings
      - ./data/graph:/app/data/graph
    depends_on:
      - ollama
      - neo4j

  ollama:
    image: ollama/ollama
    container_name: brain-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama   # downloaded models live here, persisted

  neo4j:
    image: neo4j:5.23-community
    container_name: brain-neo4j
    ports:
      - "7474:7474"   # browser UI  -> http://localhost:7474
      - "7687:7687"   # bolt (app connects here)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-password123}"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    container_name: brain-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: brain-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # console UI -> http://localhost:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  neo4j_data:
  pg_data:
  minio_data:
  ollama_models:
